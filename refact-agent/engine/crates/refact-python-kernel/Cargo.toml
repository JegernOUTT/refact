[package]
name = "refact-python-kernel"
version = "0.1.0"
edition = "2021"

[features]
default = []
typecheck = ["dep:monty-type-checking"]

[dependencies]
monty.workspace = true
monty-types.workspace = true
hmac.workspace = true
sha2 = "0.11"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
monty-type-checking = { workspace = true, optional = true }
tokio.workspace = true
sysinfo.workspace = true

chrono.workspace = true
rand = "0.8.5"
ruff_python_ast = "=0.0.14"
ruff_python_parser = "=0.0.14"
ruff_text_size = "=0.0.14"
regex.workspace = true
glob.workspace = true
similar = "2.3.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"
