[package]
name = "refact-browser"
version = "0.1.0"
edition = "2021"

[dependencies]
base64.workspace = true
chrono.workspace = true
refact-chat-api = { path = "../refact-chat-api" }
refact-core = { path = "../refact-core" }
refact-integrations = { path = "../refact-integrations" }
headless_chrome.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
url.workspace = true
tracing.workspace = true
image.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
