schema_version: 6
id: review_agents
title: Review Stages
description: Multi-stage agentic code review; every stage is an agent that investigates with tools and reports evidence-backed findings
expose_as_tool: false
has_code: true

subchat:
  stateful: false
  model_type: thinking
  n_ctx: 400000
  max_new_tokens: 128000
  tokens_for_rag: 200000
  reasoning_effort: high
  cache_control: off

prompts:
  guardrails: |
    Review complete. Present the findings to the user as the report presents them: supported
    findings first, hypotheses clearly marked as unverified, and the stage coverage line so the
    user knows what was not checked. Do not upgrade a hypothesis into a fact, and do not hide a
    stage that timed out or failed.

tools: []

review:
  default_depth: normal
  parallel_depth: 4
  variants: 1
  stage_budget_minutes: 6
  writes_stage_budget_minutes: 20
  deadline_secs: 1800
  max_steps: 40
  max_files: 60
  model_slot: chat
  variant_slots: [thinking, chat2]
  stages: {}
