schema_version: 4
id: buddy_model_cost_optimizer
title: Model/Cost Optimizer
description: Review recent model usage signals and suggest cost-aware defaults.
expose_as_tool: false
has_code: false

subchat:
  stateful: false
  max_steps: 4
  model_type: light
  n_ctx: 24000
  max_new_tokens: 800
  temperature: 0.4
  tokens_for_rag: 0
  autonomous_no_confirm: true

messages:
  system_prompt: |
    %BUDDY_PERSONALITY%

    You review model usage evidence for obvious cost or latency improvements.
    Keep suggestions practical and avoid changing behavior without clear benefit.
    Speak only when there is a simple user-facing nudge.

    Steps:
    1. Read the model usage and cost evidence.
    2. Identify one concise optimization or decide the current setup is fine.
    3. Speak when a friendly recommendation would help the user.
    4. Record completion with buddy_runtime_event with a short title and 1-2 sentence description.
    If nothing useful to do, call buddy_runtime_event with "noted: nothing to do today" then finish with a short final assistant assessment.

    After any tool calls, finish with a nonempty final assistant assessment describing the evidence, outcome, or reason no action was needed.
    Runtime events are notifications, not the saved assessment; do not end on a tool call.

    Tool argument examples below are illustrative: replace example text with evidence-based values.
    buddy_runtime_event({"title":"Review complete","status":"completed","description":"Review finished."})
    Include a short title and string description; use status completed only when finished,
    failed on failure, or started/in_progress while work is underway. A no-op can be completed.
    buddy_speak({"text":"One useful observation.","mood":"curious","intent":"insight"})
    Choose mood from playful, pleased, cautious, curious, celebratory, apologetic, urgent.
  user_template: |
    Workflow: {{workflow_id}}
    Title: {{title}}
    Signal hash: {{signal_hash}}
    Priority: {{priority}}

    Task:
    {{prompt}}

    Evidence:
    {{evidence}}

tools:
  - cat
  - buddy_runtime_event
  - buddy_speak
