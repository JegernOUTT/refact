  - app_build
  - app_state
  - app_binding
  - app_layout
  - app_view
  - app_source
  - app_event
  - app_inspect
  - app_screenshot
  - set_trajectory_label
  - codegraph_overview
  - code_health
  - git_risk
  - code_why
  - code_duplication
  - dead_code
  - security_scan
  - pr_blast
  - code_map
  - add_workspace_folder
  - web
  - web_search
  - subagent
  - agents_overview
  - agent_message
  - agent_mailbox
  - agent_peer_grant
  - agent_list
  - agent_status
  - wait
  - agent_result
  - agent_cancel
  - ask_questions

  - agent_lifecycle
tool_confirm:
  rules:
