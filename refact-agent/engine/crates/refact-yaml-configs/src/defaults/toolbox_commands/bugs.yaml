schema_version: 2
id: bugs
description: Find and fix bugs
selection_needed: [1, 50]

messages:
  - role: user
    content: |
      @file %CURRENT_FILE%:%CURSOR_LINE%
      Find and fix bugs in the code block below:
      ```
      %CODE_SELECTION%
      ```
      Fix only defects you can tie to a concrete input or state, and name that input or state for each
      fix. Do not change other behavior, add fallbacks or silence errors. If you find no real bug, say so.
