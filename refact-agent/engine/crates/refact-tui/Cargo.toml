[package]
name = "refact-tui"
version = "8.6.4"
edition = "2021"
license = "Apache-2.0"

[dependencies]
base64.workspace = true
chrono.workspace = true
crossterm = { version = "0.28.1", features = ["bracketed-paste", "event-stream"] }
dirs.workspace = true
futures.workspace = true
libc.workspace = true
pulldown-cmark = "0.10"
ratatui = { version = "0.29.0", features = ["unstable-widget-ref", "unstable-rendered-line-info", "scrolling-regions"] }
icy_sixel = "0.1.3"
reqwest.workspace = true
regex-lite = "0.1"
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
supports-color = "3"
syntect = "5"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
textwrap = "0.16.2"
thiserror = "2.0.12"
toml = "0.8"
tokio.workspace = true
tracing.workspace = true
unicode-segmentation = "1.12"
unicode-width.workspace = true
url.workspace = true
uuid.workspace = true
image.workspace = true

[dev-dependencies]
tempfile.workspace = true
