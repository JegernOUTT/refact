[package]
name = "refact-providers"
version = "0.1.0"
edition = "2021"

[dependencies]
refact-core = { path = "../refact-core" }
refact-llm = { path = "../refact-llm" }

serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio = { version = "1.43.0", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "sync", "process", "time"] }
regex.workspace = true
uuid.workspace = true

async-trait = "0.1.73"
base64 = "0.22.1"
rand = "0.8.5"
sha2 = "0.10.8"
serde_yaml = "0.9.31"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "stream", "rustls", "charset", "http2"] }
url = "2.4.1"
lazy_static = "1.4.0"
chrono = { version = "0.4.31", features = ["serde"] }
fs2 = "0.4.3"
process-wrap = { version = "8.0.2", features = ["tokio1"] }

[dev-dependencies]
tempfile = "3.8"
