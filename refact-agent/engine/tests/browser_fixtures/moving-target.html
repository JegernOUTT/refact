<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Moving target</title>
  <style>
    #moving { position: relative; animation: travel 1.5s linear forwards; }
    @keyframes travel { from { left: 0; } to { left: 240px; } }
  </style>
</head>
<body>
  <button id="moving">Moving button</button>
  <output id="result"></output>
  <script>
    const moving = document.querySelector('#moving');
    moving.addEventListener('click', () => {
      document.querySelector('#result').textContent = 'moving clicked';
    });
    globalThis.armMovingTargetForClick = () => {
      moving.style.animation = 'none';
      moving.style.left = '0px';
      void moving.offsetWidth;
      globalThis.addEventListener('mousemove', () => {
        moving.style.left = '240px';
      }, { capture: true, once: true });
    };
  </script>
</body>
</html>
