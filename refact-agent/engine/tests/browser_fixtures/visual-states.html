<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Visual states</title>
  <style>
    body { margin: 0; padding: 40px; background: #ffffff; }
    #swatch {
      width: 120px;
      height: 60px;
      border: 0;
      padding: 0;
      background: #0000ff;
    }
    #swatch:hover { background: #00ff00; }
    #swatch:focus { background: #ffff00; outline: none; }
    #swatch:active { background: #ff0000; }
    #secret {
      width: 120px;
      height: 60px;
      margin-top: 20px;
      background: #000080;
    }
    #plain {
      width: 120px;
      height: 60px;
      margin-top: 20px;
      background: #808080;
    }
  </style>
</head>
<body>
  <button id="swatch" type="button"></button>
  <div id="secret"></div>
  <div id="plain"></div>
</body>
</html>
