<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Coverage target</title>
    <style>
      .used-style { color: green; }
      .unused-style { color: red; padding: 100px; border: 10px solid purple; }
    </style>
  </head>
  <body>
    <main class="used-style">Coverage target ready</main>
    <script>
      function usedFunction() { return document.querySelector('main').textContent; }
      function unusedFunction() { return 'this block should remain unused'; }
      window.coverageTarget = usedFunction();
    </script>
  </body>
</html>
