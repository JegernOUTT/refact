# This config determines which files Refact may read or index and which destinations may receive them.
#
# If this file or a project privacy file has a syntax error, Refact keeps the last valid policy and reports the error.
# On first-load failure, Refact uses an empty policy and still reports the error.
#
# Uses glob patterns: https://en.wikipedia.org/wiki/Glob_(programming)
# Each pattern is matched against the slash-normalized absolute path, workspace/worktree-relative paths, and basename.
#
# blocked patterns are always denied. Otherwise zones are ordered and the first matching zone applies.
# Destinations are provider ids, MCP server names, subagent model providers, and completion providers.

privacy_rules:
  # Legacy lists remain supported and migrate into zones at load time.
  blocked:
    - "secrets.yaml"                  # This is the real ~/.config/refact/secrets.yaml; models must not read its passwords.
    - "*/secret_project1/*"
    - "*/secret_project2/*.txt"
    - "*.pem"

  only_send_to_servers_I_control:       # Configure controlled providers in ~/.config/refact/providers.d/*.yaml.
    - "secret_passwords.txt"

  # Zones are the current per-destination policy. Project `.refact/privacy.yaml` files may add
  # patterns, but can only remove destinations or make shell handling stricter.
  # send_to: [] denies every destination. send_to: ["*"] allows all current and future destinations.
  # on_shell_read is withhold, ask, or deny when syscall observation sees a guarded read.
  # If observation is unavailable, commands stay fail-open and heuristic attribution can miss indirect reads.
  # Completion has its own destination column; a completion provider must be present in the cursor file's zone.
  # zones:
  #   - name: secrets
  #     patterns:
  #       - "secrets.yaml"
  #       - ".env*"
  #       - "*.pem"
  #     send_to: []
  #     on_shell_read: deny
  #   - name: normal
  #     patterns:
  #       - "*"
  #     send_to:
  #       - "*"
  #     on_shell_read: withhold
  #
  # Subagent reports declassify by default. Set false to preserve the union of subchat records
  # so the parent model's destination check independently authorizes the returned report.
  # subagents:
  #   report_declassifies: true

  # tool_access controls which MCP servers a model provider may use tools from. This is tool
  # availability, not file content: a denied server's tools are never offered to that provider,
  # and mcp_call / mcp_tool_search refuse it too. A provider that is not listed may use every
  # server, so adding this section never removes tools that already worked.
  # Project files may only narrow a provider's list, never widen it.
  # tool_access:
  #   providers:
  #     openai_codex:
  #       mcp: ["github", "fetch"]
  #     ollama:
  #       mcp: ["*"]

# See unit tests in privacy.rs for more examples.

scheduler:
  enabled: true
  disable_durable: false
  max_jobs: 50
# Lifecycle hooks run shell commands on agent events (see .refact/hooks.yaml or
# ~/.config/refact/hooks.yaml). Global hooks always run. Project-local hooks are
# DISABLED by default: a cloned repository could otherwise execute arbitrary shell
# commands on your machine. To run a project's hooks, add its absolute root path
# to trusted_projects below; only listed repositories run hooks, so trusting one
# repo never trusts another. This is read at startup, so restart after changing it.
hooks:
  trusted_projects: []
  # - /absolute/path/to/a/repo/you/trust

review_commands:
  enabled: false
  allowlist: []
  max_commands_per_review: 3
