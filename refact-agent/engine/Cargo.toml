[workspace]
members = [
    "vendor/headless_chrome",
    ".",
    "crates/refact-core",
    "crates/refact-apps-core",
    "crates/refact-scheduler-core",
    "crates/refact-claude-cloud",
    "crates/refact-chat-api",
    "crates/refact-vecdb",
    "crates/refact-codegraph-parsers",
    "crates/refact-codegraph",
    "crates/refact-codehealth",
    "crates/refact-git-intel",
    "crates/refact-codewiki",
    "crates/refact-llm",
    "crates/refact-knowledge-graph",
    "crates/refact-git",
    "crates/refact-postprocessing",
    "crates/refact-stats",
    "crates/refact-scratchpads",
    "crates/refact-providers",
    "crates/refact-tool-api",
    "crates/refact-chat-history",
    "crates/refact-integrations",
    "crates/refact-browser",
    "crates/refact-ext",
    "crates/refact-yaml-configs",
    "crates/refact-worktrees",
    "crates/refact-agentic",
    "crates/refact-files",
    "crates/refact-tasks",
    "crates/refact-buddy-core",
    "crates/refact-file-edit-core",
    "crates/refact-at-web",
    "crates/refact-pricing-core",
    "crates/refact-scope-utils",
    "crates/refact-caps-core",
    "crates/refact-voice",
    "crates/refact-context-api",
    "crates/refact-runtime-api",
    "crates/refact-exec",
    "crates/refact-sandbox",
    "crates/refact-agents-core",
    "crates/refact-work-core",
    "crates/refact-review-core",
    "crates/refact-self-update",
    "crates/refact-privacy",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
tokio = { version = "1.43.0", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tracing = "0.1"
indexmap = { version = "1.9.1", features = ["serde-1"] }
itertools = "0.14.0"
lazy_static = "1.4.0"
clap = { version = "=4.5.60", features = ["derive"] }
libc = "0.2"
cap-std = "=3.4.6"
md5 = "0.7"
regex = "1.9.5"
ropey = "1.6"
tempfile = "3"
image = { version = "0.25.6", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
tokenizers = { version = "0.21.0", default-features = false, features = ["onig"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
async-trait = "0.1.73"
axum = { version = "0.6.20", features = ["default", "http2"] }
base64 = "0.22.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
dunce = "1.0.5"
fd-lock = "4.0.4"
flate2 = "1.0"
futures = "0.3"
git2 = "0.20.2"
glob = "0.3.1"
headless_chrome = "=1.0.22"
hex = "0.4.3"
home = "0.5"
html5ever = "0.27"
hyper = { version = "0.14", features = ["server", "stream"] }
log = "0.4.20"
markup5ever_rcdom = "0.3"
percent-encoding = "2.3"
petgraph = "0.6"
process-wrap = { version = "8.0.2", features = ["tokio1"] }
rand = "0.8.5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "charset", "form", "http2", "json", "rustls", "stream"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
rust-embed = { version = "8.5.0", features = ["include-exclude"] }
serde_yaml = "0.9.31"
sha2 = "0.10.8"
shell-words = "1.1.0"
sqlite-vec = "0.1.6"
strip-ansi-escapes = "0.2.1"
tokio-rusqlite = "0.5.0"
unicode-width = "0.2"
url = { version = "2", features = ["serde"] }
walkdir = "2.3"
which = "7.0.2"
zerocopy = "0.8.14"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
#debug = true
strip = true
opt-level = "z"
lto = true

[profile.ci-release]
inherits = "release"
strip = false
lto = "thin"
codegen-units = 16

[profile.ci-test]
inherits = "dev"
debug = false
incremental = false

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

# Keep CodeGraph's parser and SQLite dependencies optimized in dev builds so
# target/debug/refact-lsp indexes source at near-release speed while workspace
# crates remain debuggable. Add new tree-sitter grammar crates here.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.rusqlite]
opt-level = 3

[profile.dev.package.sqlite-vec]
opt-level = 3

[profile.dev.package.tokio-rusqlite]
opt-level = 3

[profile.dev.package.tree-sitter]
opt-level = 3

[profile.dev.package.tree-sitter-bash]
opt-level = 3

[profile.dev.package.tree-sitter-c]
opt-level = 3

[profile.dev.package.tree-sitter-c-sharp]
opt-level = 3

[profile.dev.package.tree-sitter-cpp]
opt-level = 3

[profile.dev.package.tree-sitter-elixir]
opt-level = 3

[profile.dev.package.tree-sitter-go]
opt-level = 3

[profile.dev.package.tree-sitter-haskell]
opt-level = 3

[profile.dev.package.tree-sitter-java]
opt-level = 3

[profile.dev.package.tree-sitter-javascript]
opt-level = 3

[profile.dev.package.tree-sitter-kotlin-ng]
opt-level = 3

[profile.dev.package.tree-sitter-language]
opt-level = 3

[profile.dev.package.tree-sitter-ocaml]
opt-level = 3

[profile.dev.package.tree-sitter-php]
opt-level = 3

[profile.dev.package.tree-sitter-python]
opt-level = 3

[profile.dev.package.tree-sitter-ruby]
opt-level = 3

[profile.dev.package.tree-sitter-rust]
opt-level = 3

[profile.dev.package.tree-sitter-scala]
opt-level = 3

[profile.dev.package.tree-sitter-swift]
opt-level = 3

[profile.dev.package.tree-sitter-typescript]
opt-level = 3

[package]
name = "refact-lsp"
version = "8.7.0"
edition = "2021"
build = "build.rs"

[lib]
name = "refact_lsp"
path = "src/lib.rs"

[[bin]]
name = "refact-lsp"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "mcp_echo_server"
path = "src/bin/mcp_echo_server.rs"

[[bin]]
name = "concurrent_chat_bench"
path = "tools/concurrent_chat_bench.rs"
test = false
bench = false
required-features = ["bench"]

[[bin]]
name = "refact"
path = "src/bin/refact.rs"
test = false
bench = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[[test]]
name = "daemon_proxy"
path = "tests/it/daemon_proxy.rs"
test = true

[[test]]
name = "daemon_supervisor"
path = "tests/it/daemon_supervisor.rs"

[[test]]
name = "gui_artifact"
path = "build_support/gui_artifact_tests.rs"

[features]
default = ["voice"]
voice = ["refact-voice/voice"]
bench = []
perf-tests = []
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
cc = "1"
shadow-rs = { version = "1.1.0", default-features = false, features = ["build"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"

[target.'cfg(not(windows))'.dependencies]
pnet_datalink = "0.35.0"

[dependencies]
clap.workspace = true
cap-std.workspace = true
cap-fs-ext = "3.4"

# Pinned transitive dep (via rustls -> aws-lc-rs): aws-lc-sys 0.42.0's build script
# aborts with a false-positive "COMPILER BUG DETECTED" (gcc bug 95189) on the CI
# toolchain, breaking the x86_64-unknown-linux-gnu engine build. 0.38.0 builds cleanly
# and is compatible with aws-lc-rs 1.16.x. Cargo.lock is tracked; keep this pin here.
aws-lc-sys = "=0.38.0"

refact-core = { path = "crates/refact-core" }
