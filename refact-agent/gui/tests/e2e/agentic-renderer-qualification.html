<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Offline production renderer qualification</title>
    <script data-offline-env>
      globalThis.process ??= {};
      globalThis.process.env ??= {};
      globalThis.process.env.NODE_ENV = "development";
      globalThis.process.env.DEBUG = "";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      globalThis.__REFACT_RENDERER_IMPORT__ = { status: "loading" };
      try {
        await import("./agentic-renderer-qualification.tsx");
        globalThis.__REFACT_RENDERER_IMPORT__ = { status: "ready" };
      } catch (error) {
        globalThis.__REFACT_RENDERER_IMPORT__ = {
          status: "FAIL",
          message: String(error?.message ?? error),
          stack: error?.stack ?? null,
        };
        throw error;
      }
    </script>
  </body>
</html>
