name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full revision; empty selects this event SHA including PR merge commits
        type: string
        default: ""
      rust_toolchain:
        type: string
        default: stable
      node_version:
        type: string
        default: "22.23.4"
      build_profile:
        type: string
        default: ci-release
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      rust_toolchain:
        type: string
        default: stable
      node_version:
        type: string
        default: "22.23.4"
      build_profile:
        type: string
        default: ci-release
    outputs:
      source_sha:
        value: ${{ jobs.resolve.outputs.source_sha }}
      rust_toolchain:
        value: ${{ jobs.resolve.outputs.rust_toolchain }}
      node_version:
        value: ${{ jobs.resolve.outputs.node_version }}
      qualification_artifact_id:
        value: ${{ jobs.qualify.outputs.qualification_artifact_id }}
      qualification_sha256:
        value: ${{ jobs.qualify.outputs.qualification_sha256 }}
      qualification_artifact:
        value: ${{ jobs.qualify.outputs.qualification_artifact }}
      status:
        value: ${{ jobs.qualify.outputs.status }}
      build_inputs_digest:
        value: ${{ jobs.qualify.outputs.build_inputs_digest }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      rust_toolchain: ${{ steps.identity.outputs.rust_toolchain }}
      node_version: ${{ steps.identity.outputs.node_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version || '22.23.4' }}
      - id: identity
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          TOOLCHAIN: ${{ inputs.rust_toolchain || 'stable' }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          [[ "$TOOLCHAIN" =~ ^(stable|[0-9]+\.[0-9]+\.[0-9]+|nightly-[0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update
          resolved="$TOOLCHAIN"
          if [ "$TOOLCHAIN" = stable ]; then
            resolved="$(rustup run stable rustc --version | cut -d' ' -f2)"
          fi
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "rust_toolchain=$resolved" >> "$GITHUB_OUTPUT"
          echo "node_version=$(node --version | sed 's/^v//')" >> "$GITHUB_OUTPUT"
  engine:
    needs: resolve
    uses: ./.github/workflows/agent_engine_check.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      rust_toolchain: ${{ needs.resolve.outputs.rust_toolchain }}
      node_version: ${{ needs.resolve.outputs.node_version }}
  browser:
    needs: resolve
    uses: ./.github/workflows/agent_browser_e2e.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      rust_toolchain: ${{ needs.resolve.outputs.rust_toolchain }}
      node_version: ${{ needs.resolve.outputs.node_version }}
  performance:
    needs: resolve
    uses: ./.github/workflows/engine_perf.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      rust_toolchain: ${{ needs.resolve.outputs.rust_toolchain }}
      node_version: ${{ needs.resolve.outputs.node_version }}
  windows-browser:
    needs: resolve
    uses: ./.github/workflows/agent_engine_check.yml
    with:
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      rust_toolchain: ${{ needs.resolve.outputs.rust_toolchain }}
      node_version: ${{ needs.resolve.outputs.node_version }}
      browser_artifacts_only: true
      browser_artifact_witnesses: true
      browser_roadmap_windows: true
  gui:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.resolve.outputs.node_version }}
      - run: npm ci --include=dev
        working-directory: refact-agent/gui
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: refact-agent/gui
      - name: Execute required gui inventory
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          TOOLCHAIN: ${{ needs.resolve.outputs.rust_toolchain }}
          NODE_VERSION: ${{ needs.resolve.outputs.node_version }}
          BUILD_PROFILE: ${{ inputs.build_profile || 'ci-release' }}
        run: python3 tools/dev/ci_tests.py --source-sha "$SOURCE_SHA" --toolchain "$TOOLCHAIN" --node-version "$NODE_VERSION" --build-profile "$BUILD_PROFILE" --lane gui --report gui-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-gui-${{ needs.resolve.outputs.source_sha }}
          path: gui-report.json
          if-no-files-found: error
  vscode:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.resolve.outputs.node_version }}
      - run: npm ci --include=dev
        working-directory: refact-agent/gui
      - name: Build GUI local dependency as test subject only
        run: npm run build
        working-directory: refact-agent/gui
      - run: npm ci --include=dev
        working-directory: plugins/vscode
      - name: Execute required vscode inventory
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          TOOLCHAIN: ${{ needs.resolve.outputs.rust_toolchain }}
          NODE_VERSION: ${{ needs.resolve.outputs.node_version }}
          BUILD_PROFILE: ${{ inputs.build_profile || 'ci-release' }}
        run: python3 tools/dev/ci_tests.py --source-sha "$SOURCE_SHA" --toolchain "$TOOLCHAIN" --node-version "$NODE_VERSION" --build-profile "$BUILD_PROFILE" --lane vscode --report vscode-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-vscode-${{ needs.resolve.outputs.source_sha }}
          path: vscode-report.json
          if-no-files-found: error
  jetbrains:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Execute required jetbrains inventory
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          TOOLCHAIN: ${{ needs.resolve.outputs.rust_toolchain }}
          NODE_VERSION: ${{ needs.resolve.outputs.node_version }}
          BUILD_PROFILE: ${{ inputs.build_profile || 'ci-release' }}
        run: python3 tools/dev/ci_tests.py --source-sha "$SOURCE_SHA" --toolchain "$TOOLCHAIN" --node-version "$NODE_VERSION" --build-profile "$BUILD_PROFILE" --lane jetbrains --report jetbrains-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-jetbrains-${{ needs.resolve.outputs.source_sha }}
          path: jetbrains-report.json
          if-no-files-found: error
  tooling:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workflow fixture parser
        run: python3 -m pip install PyYAML==6.0.3
      - name: Execute required tooling inventory
        env:
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          TOOLCHAIN: ${{ needs.resolve.outputs.rust_toolchain }}
          NODE_VERSION: ${{ needs.resolve.outputs.node_version }}
          BUILD_PROFILE: ${{ inputs.build_profile || 'ci-release' }}
        run: python3 tools/dev/ci_tests.py --source-sha "$SOURCE_SHA" --toolchain "$TOOLCHAIN" --node-version "$NODE_VERSION" --build-profile "$BUILD_PROFILE" --lane tooling --report tooling-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-tooling-${{ needs.resolve.outputs.source_sha }}
          path: tooling-report.json
          if-no-files-found: error
  build-freshness:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact fixture toolchain
        env:
          RUSTUP_TOOLCHAIN: ${{ needs.resolve.outputs.rust_toolchain }}
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: refact-agent/engine -> target
          key: build-freshness-${{ needs.resolve.outputs.rust_toolchain }}
          cache-bin: false
      - name: Bootstrap fixture download cache without building distribution
        working-directory: refact-agent/engine
        env:
          RUSTUP_TOOLCHAIN: ${{ needs.resolve.outputs.rust_toolchain }}
        run: cargo fetch --locked
      - name: Execute required offline Cargo regression fixtures
        env:
          RUSTUP_TOOLCHAIN: ${{ needs.resolve.outputs.rust_toolchain }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          TOOLCHAIN: ${{ needs.resolve.outputs.rust_toolchain }}
          NODE_VERSION: ${{ needs.resolve.outputs.node_version }}
          BUILD_PROFILE: ${{ inputs.build_profile || 'ci-release' }}
        run: python3 tools/dev/ci_tests.py --source-sha "$SOURCE_SHA" --toolchain "$TOOLCHAIN" --node-version "$NODE_VERSION" --build-profile "$BUILD_PROFILE" --lane build-freshness --report build-freshness-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-build-freshness-${{ needs.resolve.outputs.source_sha }}
          path: build-freshness-report.json
          if-no-files-found: error
  qualify:
    if: always()
    needs: [resolve, engine, browser, windows-browser, performance, gui, vscode, jetbrains, tooling, build-freshness]
    runs-on: ubuntu-latest
    outputs:
      qualification_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      qualification_sha256: ${{ steps.result.outputs.qualification_sha256 }}
      qualification_artifact: ${{ steps.result.outputs.artifact }}
      status: ${{ steps.result.outputs.status }}
      build_inputs_digest: ${{ steps.result.outputs.build_inputs_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: tests-*-${{ needs.resolve.outputs.source_sha }}
          path: lane-reports
      - name: Qualify every required dependency
        id: result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          NODE_VERSION: ${{ needs.resolve.outputs.node_version }}
          BUILD_PROFILE: ${{ inputs.build_profile || 'ci-release' }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          TOOLCHAIN: ${{ needs.resolve.outputs.rust_toolchain }}
        run: |
          echo "artifact=tests-qualification-$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          python3 tools/dev/ci_tests.py --source-sha "$SOURCE_SHA" --toolchain "$TOOLCHAIN" --node-version "$NODE_VERSION" --build-profile "$BUILD_PROFILE" --needs-json "$NEEDS_JSON" --report tests-qualification.json
          echo "build_inputs_digest=$(python3 -c 'import json; print(json.load(open("tests-qualification.json"))["build_inputs_digest"])')" >> "$GITHUB_OUTPUT"
          echo "qualification_sha256=$(sha256sum tests-qualification.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "status=PASS" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: upload
        if: always()
        with:
          name: tests-qualification-${{ needs.resolve.outputs.source_sha || github.sha }}
          path: tests-qualification.json
          if-no-files-found: error
