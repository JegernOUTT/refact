name: Refact Agent Engine CI check

on:
  pull_request:
    branches:
      - main
    paths:
      - "refact-agent/engine/**"
      - ".github/workflows/agent_engine_check.yml"
  push:
    branches:
      - main
    tags:
      - "*"
    paths:
      - "refact-agent/engine/**"
      - ".github/workflows/agent_engine_check.yml"
  workflow_dispatch:

concurrency:
  group: engine-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: refact-agent/engine

env:
  REFACT_SKIP_GUI_BUILD: "1"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  check:
    name: Engine correctness (Linux x86_64)
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup update --no-self-update stable

      - name: Ensure Python is available
        run: python3 --version

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold lld

      - name: Restore cached cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            refact-agent/engine -> target
          key: ci-test-linux-x64
          shared-key: ci-test-linux-x64
          cache-bin: false

      - name: Run workspace library tests
        run: cargo test --workspace --profile ci-test --lib

      - name: Run workspace integration tests
        run: cargo test --workspace --profile ci-test --test '*'

      - name: Build refact daemon binary
        run: cargo build --bin refact --profile ci-test

      - name: Run daemon E2E suite
        run: "REFACT_DAEMON_E2E=1 PYTHON3=python3 cargo test --profile ci-test --test it -- daemon_e2e:: --nocapture --test-threads=1"

      - name: Run workspace documentation tests
        run: cargo test --workspace --profile ci-test --doc

  platform-tests:
    name: Platform tests (${{ matrix.target }})
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}
    env:
      REFACT_SKIP_GUI_BUILD: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup target add ${{ matrix.target }}
          rustup component add rust-src

      - name: Install LLVM (Windows)
        if: startsWith(matrix.os, 'windows')
        run: choco install llvm -y

      - name: Install LLVM (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install llvm

      - name: Restore cached cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            refact-agent/engine -> target
          key: ci-test-${{ matrix.target }}
          shared-key: ci-test-${{ matrix.target }}
          cache-bin: false

      - name: Run workspace library tests (Windows)
        if: startsWith(matrix.os, 'windows')
        env:
          REFACT_GUI_DIR: ${{ github.workspace }}\refact-agent\gui
        shell: bash
        run: cargo test --workspace --exclude refact-tui --profile ci-test --lib --target ${{ matrix.target }}

      - name: Run workspace library tests (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          OPENSSL_STATIC: "1"
        run: cargo test --workspace --exclude refact-lsp --profile ci-test --lib --target ${{ matrix.target }}

      - name: Run workspace integration tests (Windows)
        if: startsWith(matrix.os, 'windows')
        env:
          REFACT_GUI_DIR: ${{ github.workspace }}\refact-agent\gui
        shell: bash
        run: cargo test --workspace --exclude refact-tui --profile ci-test --test '*' --target ${{ matrix.target }}

      - name: Run workspace integration tests (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          OPENSSL_STATIC: "1"
        run: cargo test --workspace --exclude refact-lsp --profile ci-test --test '*' --target ${{ matrix.target }}
