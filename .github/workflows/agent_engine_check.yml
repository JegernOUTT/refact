name: Refact Agent Engine CI check

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      rust_toolchain:
        type: string
        required: true
      node_version:
        type: string
        default: "22"
      browser_artifacts_only:
        type: boolean
        default: false
      browser_artifact_witnesses:
        type: boolean
        default: false
      browser_roadmap_windows:
        type: boolean
        default: false
      expected_sha:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        default: ""
      rust_toolchain:
        type: string
        default: stable
      browser_artifacts_only:
        description: Run focused Windows browser artifact qualification
        type: boolean
        default: false
      browser_artifact_witnesses:
        description: Execute and restore controlled Windows artifact and startup faults
        type: boolean
        default: false
      browser_roadmap_windows:
        description: Run real Chrome Windows roadmap qualification
        type: boolean
        default: false
      expected_sha:
        description: Exact qualification revision to execute
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: engine-check-${{ github.workflow }}-${{ github.run_id }}-${{ inputs.browser_artifacts_only }}-${{ inputs.browser_roadmap_windows }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: refact-agent/engine

env:
  REFACT_SOURCE_SHA: ${{ inputs.source_sha || inputs.expected_sha || github.sha }}
  RUSTUP_TOOLCHAIN: ${{ inputs.rust_toolchain || 'stable' }}
  REFACT_SKIP_GUI_BUILD: "1"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  check:
    name: Engine correctness (Linux x86_64)
    if: ${{ !inputs.browser_artifacts_only && !inputs.browser_roadmap_windows && (inputs.source_sha != '' || github.event_name != 'push' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-22.04
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || inputs.expected_sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || inputs.expected_sha || github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Disable local development defaults and install stable CI toolchain
        shell: bash
        run: |
          rm -f ../../.cargo/config.toml
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src --no-self-update

      - name: Ensure Python is available
        run: python3 --version

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold lld

      - name: Add swap space
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=128M count=64
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Restore cached cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            refact-agent/engine -> target
          key: ci-test-linux-x64
          shared-key: ci-test-linux-x64
          cache-bin: false

      - name: Compile workspace library tests
        timeout-minutes: 120
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          cargo test --workspace --profile ci-test --lib --no-run

      - name: Run workspace library tests
        env:
          RUST_MIN_STACK: "16777216"
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          set -o pipefail
          cargo test --workspace --profile ci-test --lib 2>&1 | tee test-output.txt
          python ../../tools/dev/ci_tests.py verify-output test-output.txt

      - name: Compile workspace integration tests
        timeout-minutes: 120
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          cargo test --workspace --profile ci-test --test '*' --no-run

      - name: Run workspace integration tests
        env:
          RUST_MIN_STACK: "16777216"
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          set -o pipefail
          cargo test --workspace --profile ci-test --test '*' 2>&1 | tee test-output.txt
          python ../../tools/dev/ci_tests.py verify-output test-output.txt

      - name: Build refact daemon binary
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          cargo build --bin refact --profile ci-test

      - name: Run daemon E2E suite
        env:
          RUST_MIN_STACK: "16777216"
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          set -o pipefail
          REFACT_DAEMON_E2E=1 PYTHON3=python3 cargo test --profile ci-test --test it -- daemon_e2e:: --nocapture --test-threads=1 2>&1 | tee daemon-output.txt
          python ../../tools/dev/ci_tests.py verify-output daemon-output.txt

      - name: Build owned tool-job fixture subject
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          cargo build --locked --bin refact-lsp --profile ci-test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install isolated fixture Python dependencies
        run: python3 -m pip install aiohttp==3.11.18 pytest==8.4.2 pytest-asyncio==0.25.3 httpx==0.28.1

      - name: Run tool-job fixture unit tests
        run: python3 ../../tools/dev/ci_tests.py unittest tests/test_tool_jobs_smoke.py

      - name: Run required owned worker integration suites
        shell: bash
        run: |
          binary="$PWD/target/ci-test/refact-lsp"
          python3 tests/owned_engine.py --binary "$binary" --binary-sha256 "$(sha256sum "$binary" | cut -d' ' -f1)"

      - name: Retain owned integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-integration-${{ inputs.source_sha || inputs.expected_sha || github.sha }}
          path: .refact/verification/owned-integration/
          include-hidden-files: true
          if-no-files-found: error

      - name: Run required owned utility integration suites
        shell: bash
        run: |
          binary="$PWD/target/ci-test/refact-lsp"
          python3 tests/owned_utility_tests.py --binary "$binary" --binary-sha256 "$(sha256sum "$binary" | cut -d' ' -f1)"

      - name: Retain owned utility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-utility-${{ inputs.source_sha || inputs.expected_sha || github.sha }}
          path: .refact/verification/owned-utility/
          include-hidden-files: true
          if-no-files-found: error

      - name: Run owned tool-job local-provider smoke
        shell: bash
        run: |
          binary="$PWD/target/ci-test/refact-lsp"
          python3 tests/test_tool_jobs_smoke.py --binary "$binary" --binary-sha256 "$(sha256sum "$binary" | cut -d' ' -f1)"

      - name: Run required owned chat session suites
        shell: bash
        run: |
          binary="$PWD/target/ci-test/refact-lsp"
          python3 tests/owned_chat_sessions.py --binary "$binary" --binary-sha256 "$(sha256sum "$binary" | cut -d' ' -f1)"

      - name: Retain owned chat session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-chat-sessions-${{ inputs.source_sha || inputs.expected_sha || github.sha }}
          path: .refact/verification/owned-chat-sessions/
          include-hidden-files: true
          if-no-files-found: error

      - name: Run workspace documentation tests
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          set -o pipefail
          cargo test --workspace --profile ci-test --doc 2>&1 | tee doc-output.txt
          python ../../tools/dev/ci_tests.py verify-output doc-output.txt

  platform-tests:
    name: Platform tests (${{ matrix.target }})
    if: ${{ !inputs.browser_artifacts_only && !inputs.browser_roadmap_windows && (inputs.source_sha != '' || github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) }}
    env:
      REFACT_SKIP_GUI_BUILD: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || inputs.expected_sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || inputs.expected_sha || github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Disable local development defaults and install stable CI toolchain
        shell: bash
        run: |
          rm -f ../../.cargo/config.toml
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src --target ${{ matrix.target }} --no-self-update

      - name: Install LLVM (Windows)
        if: startsWith(matrix.os, 'windows')
        run: choco install llvm -y

      - name: Install LLVM (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install llvm

      - name: Install Linux ARM build tools
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake libclang-dev lld mold libssl-dev pkg-config

      - name: Restore cached cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            refact-agent/engine -> target
          key: ci-test-${{ matrix.target }}-consistent-msvc-crt-v1
          shared-key: ci-test-${{ matrix.target }}-consistent-msvc-crt-v1
          cache-bin: false

      - name: Compile workspace library tests (Windows)
        if: startsWith(matrix.os, 'windows')
        timeout-minutes: 120
        env:
          RUST_MIN_STACK: "16777216"
          REFACT_GUI_DIR: ${{ github.workspace }}\refact-agent\gui
          CMAKE_POLICY_DEFAULT_CMP0091: NEW
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          cargo test --workspace --profile ci-test --lib --target ${{ matrix.target }} --no-run

      - name: Run workspace library tests (Windows)
        if: startsWith(matrix.os, 'windows')
        timeout-minutes: 90
        env:
          RUST_MIN_STACK: "16777216"
          REFACT_GUI_DIR: ${{ github.workspace }}\refact-agent\gui
          CMAKE_POLICY_DEFAULT_CMP0091: NEW
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          set -o pipefail
          cargo test --workspace --profile ci-test --lib --target ${{ matrix.target }} -- --nocapture --test-threads=1 2>&1 | tee test-output.txt
          python ../../tools/dev/ci_tests.py verify-output test-output.txt

      - name: Run workspace library tests (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          RUST_MIN_STACK: "16777216"
          OPENSSL_STATIC: "1"
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          set -o pipefail
          cargo test --workspace --profile ci-test --lib --target ${{ matrix.target }} 2>&1 | tee test-output.txt
          python ../../tools/dev/ci_tests.py verify-output test-output.txt

      - name: Run workspace library tests (Linux ARM)
        if: startsWith(matrix.os, 'ubuntu')
        env:
          RUST_MIN_STACK: "16777216"
          OPENSSL_STATIC: "1"
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          set -o pipefail
          cargo test --workspace --profile ci-test --lib --target ${{ matrix.target }} 2>&1 | tee test-output.txt
          python ../../tools/dev/ci_tests.py verify-output test-output.txt

      - name: Run workspace integration tests (Windows)
        if: startsWith(matrix.os, 'windows')
        timeout-minutes: 60
        env:
          RUST_MIN_STACK: "16777216"
          REFACT_GUI_DIR: ${{ github.workspace }}\refact-agent\gui
          CMAKE_POLICY_DEFAULT_CMP0091: NEW
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          set -o pipefail
          cargo test --workspace --profile ci-test --test '*' --target ${{ matrix.target }} -- --nocapture --test-threads=1 2>&1 | tee test-output.txt
          python ../../tools/dev/ci_tests.py verify-output test-output.txt

      - name: Run workspace integration tests (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          RUST_MIN_STACK: "16777216"
          OPENSSL_STATIC: "1"
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          set -o pipefail
          cargo test --workspace --profile ci-test --test '*' --target ${{ matrix.target }} 2>&1 | tee test-output.txt
          python ../../tools/dev/ci_tests.py verify-output test-output.txt

      - name: Run workspace integration tests (Linux ARM)
        if: startsWith(matrix.os, 'ubuntu')
        env:
          RUST_MIN_STACK: "16777216"
          OPENSSL_STATIC: "1"
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          set -o pipefail
          cargo test --workspace --profile ci-test --test '*' --target ${{ matrix.target }} 2>&1 | tee test-output.txt
          python ../../tools/dev/ci_tests.py verify-output test-output.txt

  browser-artifacts-windows:
    name: Browser artifact qualification (Windows x86_64)
    if: ${{ (github.event_name == 'workflow_dispatch' || inputs.source_sha != '') && (inputs.browser_artifacts_only || inputs.browser_roadmap_windows) }}
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RUST_MIN_STACK: "16777216"
      BROWSER_QUALIFICATION_SHA: ${{ inputs.source_sha || inputs.expected_sha }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout qualification revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || inputs.expected_sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || inputs.expected_sha || github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Verify qualification revision
        shell: bash
        run: |
          test -n "$BROWSER_QUALIFICATION_SHA"
          test "$(git rev-parse HEAD)" = "$BROWSER_QUALIFICATION_SHA"

      - name: Install stable Rust without local development defaults
        shell: bash
        run: |
          rm -f ../../.cargo/config.toml
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      - name: Restore browser crate build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: refact-agent/engine -> target
          key: browser-artifacts-windows-msvc-v1
          cache-bin: false

      - name: Verify browser crate and artifact consumers
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          git rev-parse HEAD
          cargo test --locked --profile ci-test -p refact-browser --lib -- --nocapture --test-threads=1

      - name: Verify pending Chrome startup pipe deadline
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          set -o pipefail
          cargo test --locked --profile ci-test -p headless_chrome --lib pending_stderr_obeys_original_startup_deadline -- --nocapture --test-threads=1 2>&1 | tee test-output.txt
          python ../../tools/dev/ci_tests.py verify-output test-output.txt

      - name: Execute controlled production fault witnesses
        if: ${{ inputs.browser_artifact_witnesses }}
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          python ../../tools/dev/browser_artifact_witness.py

      - name: Install LLVM for full engine build
        if: ${{ inputs.browser_roadmap_windows }}
        run: choco install llvm -y --no-progress

      - name: Parse Windows qualification runner
        if: ${{ inputs.browser_roadmap_windows }}
        shell: pwsh
        run: |
          $env:GITHUB_SHA = $env:REFACT_SOURCE_SHA
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '../../tools/dev/browser_windows_roadmap_qualification.ps1').Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Run isolated Windows Chrome roadmap qualification
        if: ${{ inputs.browser_roadmap_windows }}
        shell: pwsh
        env:
          REFACT_GUI_DIR: ${{ github.workspace }}\refact-agent\gui
          CMAKE_POLICY_DEFAULT_CMP0091: NEW
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        run: |
          $env:GITHUB_SHA = $env:REFACT_SOURCE_SHA
          ../../tools/dev/browser_windows_roadmap_qualification.ps1

      - name: Retain Windows roadmap evidence
        if: ${{ always() && inputs.browser_roadmap_windows }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-windows-roadmap-${{ github.sha }}
          path: ${{ runner.temp }}/browser-windows-roadmap-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain fault witness evidence
        if: ${{ always() && inputs.browser_artifact_witnesses }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifact-witness-${{ github.sha }}
          path: refact-agent/engine/target/browser-artifact-witness/
          retention-days: 14
