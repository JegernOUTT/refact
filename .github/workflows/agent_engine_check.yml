name: Refact Agent Engine CI check

on:
  pull_request:
    branches:
      - main
    paths:
      - "refact-agent/engine/**"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/agent_engine_check.yml"
  push:
    branches:
      - main
    tags:
      - "*"
    paths:
      - "refact-agent/engine/**"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/agent_engine_check.yml"
  workflow_dispatch:
    inputs:
      browser_artifacts_only:
        description: Run focused Windows browser artifact qualification
        type: boolean
        default: false
      browser_artifact_witnesses:
        description: Execute and restore controlled Windows artifact and startup faults
        type: boolean
        default: false
      browser_roadmap_windows:
        description: Run real Chrome Windows roadmap qualification
        type: boolean
        default: false
      expected_sha:
        description: Exact qualification revision to execute
        type: string
        default: ""

concurrency:
  group: engine-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: refact-agent/engine

env:
  RUSTUP_TOOLCHAIN: stable
  REFACT_SKIP_GUI_BUILD: "1"
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  check:
    name: Engine correctness (Linux x86_64)
    if: ${{ !inputs.browser_artifacts_only && !inputs.browser_roadmap_windows && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-22.04
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disable local development defaults and install stable CI toolchain
        shell: bash
        run: |
          rm -f ../../.cargo/config.toml
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src --no-self-update

      - name: Ensure Python is available
        run: python3 --version

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold lld

      - name: Add swap space
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=128M count=64
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Restore cached cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            refact-agent/engine -> target
          key: ci-test-linux-x64
          shared-key: ci-test-linux-x64
          cache-bin: false

      - name: Compile workspace library tests
        timeout-minutes: 120
        run: cargo test --workspace --profile ci-test --lib --no-run

      - name: Run workspace library tests
        env:
          RUST_MIN_STACK: "16777216"
        run: cargo test --workspace --profile ci-test --lib

      - name: Compile workspace integration tests
        timeout-minutes: 120
        run: cargo test --workspace --profile ci-test --test '*' --no-run

      - name: Run workspace integration tests
        env:
          RUST_MIN_STACK: "16777216"
        run: cargo test --workspace --profile ci-test --test '*'

      - name: Build refact daemon binary
        run: cargo build --bin refact --profile ci-test

      - name: Run daemon E2E suite
        env:
          RUST_MIN_STACK: "16777216"
        run: "REFACT_DAEMON_E2E=1 PYTHON3=python3 cargo test --profile ci-test --test it -- daemon_e2e:: --nocapture --test-threads=1"

      - name: Run workspace documentation tests
        run: cargo test --workspace --profile ci-test --doc

  platform-tests:
    name: Platform tests (${{ matrix.target }})
    if: ${{ !inputs.browser_artifacts_only && !inputs.browser_roadmap_windows && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) }}
    env:
      REFACT_SKIP_GUI_BUILD: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Disable local development defaults and install stable CI toolchain
        shell: bash
        run: |
          rm -f ../../.cargo/config.toml
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src --target ${{ matrix.target }} --no-self-update

      - name: Install LLVM (Windows)
        if: startsWith(matrix.os, 'windows')
        run: choco install llvm -y

      - name: Install LLVM (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install llvm

      - name: Install Linux ARM build tools
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake libclang-dev lld mold libssl-dev pkg-config

      - name: Restore cached cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            refact-agent/engine -> target
          key: ci-test-${{ matrix.target }}-consistent-msvc-crt-v1
          shared-key: ci-test-${{ matrix.target }}-consistent-msvc-crt-v1
          cache-bin: false

      - name: Compile workspace library tests (Windows)
        if: startsWith(matrix.os, 'windows')
        timeout-minutes: 120
        env:
          RUST_MIN_STACK: "16777216"
          REFACT_GUI_DIR: ${{ github.workspace }}\refact-agent\gui
          CMAKE_POLICY_DEFAULT_CMP0091: NEW
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        shell: bash
        run: cargo test --workspace --profile ci-test --lib --target ${{ matrix.target }} --no-run

      - name: Run workspace library tests (Windows)
        if: startsWith(matrix.os, 'windows')
        timeout-minutes: 90
        env:
          RUST_MIN_STACK: "16777216"
          REFACT_GUI_DIR: ${{ github.workspace }}\refact-agent\gui
          CMAKE_POLICY_DEFAULT_CMP0091: NEW
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        shell: bash
        run: cargo test --workspace --profile ci-test --lib --target ${{ matrix.target }} -- --nocapture --test-threads=1

      - name: Run workspace library tests (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          RUST_MIN_STACK: "16777216"
          OPENSSL_STATIC: "1"
        run: cargo test --workspace --exclude refact-lsp --profile ci-test --lib --target ${{ matrix.target }}

      - name: Run workspace library tests (Linux ARM)
        if: startsWith(matrix.os, 'ubuntu')
        env:
          RUST_MIN_STACK: "16777216"
          OPENSSL_STATIC: "1"
        run: cargo test --workspace --exclude refact-lsp --profile ci-test --lib --target ${{ matrix.target }}

      - name: Run workspace integration tests (Windows)
        if: startsWith(matrix.os, 'windows')
        timeout-minutes: 60
        env:
          RUST_MIN_STACK: "16777216"
          REFACT_GUI_DIR: ${{ github.workspace }}\refact-agent\gui
          CMAKE_POLICY_DEFAULT_CMP0091: NEW
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        shell: bash
        run: cargo test --workspace --profile ci-test --test '*' --target ${{ matrix.target }} -- --nocapture --test-threads=1

      - name: Run workspace integration tests (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          RUST_MIN_STACK: "16777216"
          OPENSSL_STATIC: "1"
        run: cargo test --workspace --exclude refact-lsp --profile ci-test --test '*' --target ${{ matrix.target }}

      - name: Run workspace integration tests (Linux ARM)
        if: startsWith(matrix.os, 'ubuntu')
        env:
          RUST_MIN_STACK: "16777216"
          OPENSSL_STATIC: "1"
        run: cargo test --workspace --exclude refact-lsp --profile ci-test --test '*' --target ${{ matrix.target }}

  browser-artifacts-windows:
    name: Browser artifact qualification (Windows x86_64)
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.browser_artifacts_only || inputs.browser_roadmap_windows) }}
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RUST_MIN_STACK: "16777216"
      BROWSER_QUALIFICATION_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Checkout qualification revision
        uses: actions/checkout@v4

      - name: Verify qualification revision
        shell: bash
        run: |
          test -n "$BROWSER_QUALIFICATION_SHA"
          test "$(git rev-parse HEAD)" = "$BROWSER_QUALIFICATION_SHA"

      - name: Install stable Rust without local development defaults
        shell: bash
        run: |
          rm -f ../../.cargo/config.toml
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      - name: Restore browser crate build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: refact-agent/engine -> target
          key: browser-artifacts-windows-msvc-v1
          cache-bin: false

      - name: Verify browser crate and artifact consumers
        shell: bash
        run: |
          git rev-parse HEAD
          cargo test --locked --profile ci-test -p refact-browser --lib -- --nocapture --test-threads=1

      - name: Verify pending Chrome startup pipe deadline
        shell: bash
        run: cargo test --locked --profile ci-test -p headless_chrome --lib pending_stderr_obeys_original_startup_deadline -- --nocapture --test-threads=1

      - name: Execute controlled production fault witnesses
        if: ${{ inputs.browser_artifact_witnesses }}
        shell: bash
        run: python ../../tools/dev/browser_artifact_witness.py

      - name: Install LLVM for full engine build
        if: ${{ inputs.browser_roadmap_windows }}
        run: choco install llvm -y --no-progress

      - name: Parse Windows qualification runner
        if: ${{ inputs.browser_roadmap_windows }}
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '../../tools/dev/browser_windows_roadmap_qualification.ps1').Path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Run isolated Windows Chrome roadmap qualification
        if: ${{ inputs.browser_roadmap_windows }}
        shell: pwsh
        env:
          REFACT_GUI_DIR: ${{ github.workspace }}\refact-agent\gui
          CMAKE_POLICY_DEFAULT_CMP0091: NEW
          CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
        run: ../../tools/dev/browser_windows_roadmap_qualification.ps1

      - name: Retain Windows roadmap evidence
        if: ${{ always() && inputs.browser_roadmap_windows }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-windows-roadmap-${{ github.sha }}
          path: ${{ runner.temp }}/browser-windows-roadmap-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Retain fault witness evidence
        if: ${{ always() && inputs.browser_artifact_witnesses }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifact-witness-${{ github.sha }}
          path: refact-agent/engine/target/browser-artifact-witness/
          retention-days: 14
