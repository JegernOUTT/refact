name: Refact Agent Engine CI build (Rust)

on:
  push:
    tags:
      - "*"
  pull_request:
    branches:
      - main
    paths:
      - "refact-agent/engine/**"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/agent_engine_build.yml"
  workflow_call:

concurrency:
  group: agent-engine-build-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: refact-agent/engine

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  FETCH_DEPTH: 0 # pull in the tags for the version string
  MACOSX_DEPLOYMENT_TARGET: 10.15

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            code-target: win32-x64
            ext: .exe
          - os: windows-latest
            target: i686-pc-windows-msvc
            code-target: win32-ia32
            ext: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            code-target: win32-arm64
            ext: .exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            code-target: linux-x64
            cross: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            code-target: linux-arm64
          # x86_64-apple-darwin (macOS Intel) is disabled — GitHub-hosted macos-15-large runners
          # incur significant costs and Intel Mac support is being phased out. Re-enable only if
          # explicitly needed and billing is confirmed.
          - os: macos-15
            target: aarch64-apple-darwin
            code-target: darwin-arm64 

    env:
      LLM_LS_TARGET: ${{ matrix.target }}

    name: dist (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}

      - name: Disable local development defaults and install stable CI toolchain
        shell: bash
        run: |
          rm -f ../../.cargo/config.toml
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src --target ${{ matrix.target }} --no-self-update

      - name: Install Node.js for engine-served GUI bundle
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: refact-agent/gui/package-lock.json

      - name: Install native GUI build dependencies
        if: startsWith(matrix.os, 'windows') || startsWith(matrix.os, 'macos')
        working-directory: refact-agent/gui
        run: npm ci --include=dev

      - name: Install LLVM (Windows)
        if: startsWith(matrix.os, 'windows')
        run: choco install llvm -y

      - name: Install LLVM (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install llvm

      - name: Install build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold lld

      - name: Add swap space (Linux cross-compilation needs extra RAM for LTO)
        if: matrix.cross
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=128M count=64
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Restore cached cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            refact-agent/engine -> target
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo
          shared-key: ${{ matrix.os }}-${{ matrix.target }}-cargo
          cache-bin: false

      - name: Install cross-rs
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
          fallback: none

      - name: Prepare cross-container GUI dependencies
        if: matrix.cross
        run: |
          docker run --rm --entrypoint bash \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/refact-agent/engine \
            ghcr.io/cross-rs/x86_64-unknown-linux-gnu:main@sha256:52fe95895e48d434c349959ca52c7bb93d7cf5ab8ea2b7d5d9f7e0e655c2e579 \
            -euo pipefail -c '
              restore_host_ownership() {
                status=$?
                chown -R "$(stat -c %u /workspace)":"$(stat -c %g /workspace)" /workspace/refact-agent/gui || status=$?
                exit "$status"
              }
              trap restore_host_ownership EXIT
              apt-get update
              apt-get install -y ca-certificates curl xz-utils
              bash /workspace/tools/dev/prepare_ci_gui.sh /workspace/refact-agent/gui
            '

      - name: Build artifact
        if: matrix.cross == null && startsWith(matrix.os, 'windows')
        env:
          REFACT_GUI_DIR: ${{ github.workspace }}\refact-agent\gui
        shell: bash
        run: |
          cargo build --workspace --profile ci-release --target ${{ matrix.target }}
          cp ./target/${{ matrix.target }}/ci-release/refact-lsp${{ matrix.ext }} ../..
          cp ./target/${{ matrix.target }}/ci-release/refact${{ matrix.ext }} ../..

      - name: Build artifact
        if: startsWith(matrix.os, 'macos')
        env:
          CARGO_PROFILE_CI_RELEASE_LTO: ${{ endsWith(matrix.target, 'apple-darwin') && 'thin' || 'true' }}
        run: |
          OPENSSL_STATIC=1 cargo build --workspace --profile ci-release --target ${{ matrix.target }}
          cp ./target/${{ matrix.target }}/ci-release/refact-lsp${{ matrix.ext }} ../..
          cp ./target/${{ matrix.target }}/ci-release/refact${{ matrix.ext }} ../..

      - name: Build linux-like artifact
        if: matrix.cross
        env:
          CARGO_BUILD_JOBS: "2"
          CROSS_CONTAINER_OPTS: --volume "${{ github.workspace }}/refact-agent/gui:/gui:rw"
        run: |
          CROSS_NO_WARNINGS=0 cross +${RUSTUP_TOOLCHAIN} build --workspace --profile ci-release --target ${{ matrix.target }}
          cp ./target/${{ matrix.target }}/ci-release/refact-lsp${{ matrix.ext }} ../..
          cp ./target/${{ matrix.target }}/ci-release/refact${{ matrix.ext }} ../..

      - name: Build native linux ARM artifact
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_PROFILE_CI_RELEASE_LTO: thin
          OPENSSL_STATIC: "1"
        run: |
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"
          docker run --rm --platform linux/arm64 \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e CARGO_HOME=/cargo \
            -e RUSTUP_HOME=/rustup \
            -e RUSTUP_TOOLCHAIN \
            -e CARGO_PROFILE_CI_RELEASE_LTO \
            -e OPENSSL_STATIC \
            -e REFACT_GUI_DIR=/workspace/refact-agent/gui \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$HOME/.cargo/registry:/cargo/registry" \
            -v "$HOME/.cargo/git:/cargo/git" \
            -w /workspace/refact-agent/engine \
            ubuntu:20.04 bash -euo pipefail -c '
              restore_host_ownership() {
                status=$?
                for path in /workspace/refact-agent/gui /workspace/refact-agent/engine/target /cargo/registry /cargo/git /workspace/refact-lsp /workspace/refact; do
                  if [ -e "$path" ]; then
                    chown -R "$HOST_UID:$HOST_GID" "$path" || status=$?
                  fi
                done
                exit "$status"
              }
              trap restore_host_ownership EXIT
              mkdir -p target "$CARGO_HOME/registry" "$CARGO_HOME/git"
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates clang cmake curl git libclang-dev libssl-dev lld pkg-config unzip xz-utils
              bash /workspace/tools/dev/prepare_ci_gui.sh /workspace/refact-agent/gui
              export PATH="/opt/refact-ci-node/bin:$PATH"
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
              export PATH="$CARGO_HOME/bin:$PATH"
              rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src --target aarch64-unknown-linux-gnu --no-self-update
              git config --global --add safe.directory /workspace
              cargo build --workspace --profile ci-release --target aarch64-unknown-linux-gnu
              cp target/aarch64-unknown-linux-gnu/ci-release/refact-lsp /workspace/refact-lsp
              cp target/aarch64-unknown-linux-gnu/ci-release/refact /workspace/refact
            '

      - name: Check native ARM glibc floor
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          # GLIBC_2.31 comes from Ubuntu 20.04 in the pinned Cross image at cross-rs/cross revision 29d00c7803f221f1b3f35e561b03792368fb8339.
          floor=GLIBC_2.31
          for binary in target/${{ matrix.target }}/ci-release/refact-lsp target/${{ matrix.target }}/ci-release/refact; do
            required=$(objdump -T "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "$binary: $required (maximum allowed: $floor)"
            if [[ -z "$required" || "$(printf '%s\n%s\n' "$floor" "$required" | sort -V | tail -1)" != "$floor" ]]; then
              echo "$binary requires a glibc newer than $floor" >&2
              exit 1
            fi
          done
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          if-no-files-found: ignore
          path: |
            refact-lsp
            refact-lsp.exe
            refact
            refact.exe
