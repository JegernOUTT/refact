name: Refact Plugin CI build

# Legacy manual entry point. build_only=true builds everything without publishing;
# build_only=false publishes an UNTESTED GitHub prerelease only. Stable releases use release.yml.
on:
  workflow_dispatch:
    inputs:
      build_only:
        description: Build and package artifacts without publishing
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  prerelease:
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/prerelease.yml
    with:
      channel: preview
      source_sha: ${{ github.sha }}
      publish: ${{ !inputs.build_only }}
