name: Refact Agent Engine CI Release (Rust)

# Legacy manual entry point. There is no engine-only stable path: this delegates to the gated
# release.yml, which publishes engine/v<ver> runtime assets before the IDE plugins.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version X.Y.Z
        type: string
        required: true
      source_sha:
        description: Full commit SHA to release
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}
    secrets:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
