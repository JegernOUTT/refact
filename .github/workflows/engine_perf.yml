name: Engine Performance

# The perf_harness benchmarks execute real workloads and measure wall-clock, CPU
# and IO. They are excluded from the correctness gate by the `perf-tests`
# feature and run here instead, single-threaded so the measurements mean
# something. Linux only: the CPU and IO counters are cfg(target_os = "linux").

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      rust_toolchain:
        type: string
        required: true
      node_version:
        type: string
        default: "22"
  workflow_dispatch:
    inputs:
      source_sha:
        type: string
        default: ""
      rust_toolchain:
        type: string
        default: stable
  schedule:
    - cron: "0 5 * * *"
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: engine-perf-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: refact-agent/engine

env:
  REFACT_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
  RUSTUP_TOOLCHAIN: ${{ inputs.rust_toolchain || 'stable' }}
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  WHISPER_DONT_GENERATE_BINDINGS: "1"

jobs:
  engine-perf:
    if: inputs.source_sha != '' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'engine-perf')
    name: Engine performance benchmarks (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install Node.js for engine-served GUI bundle
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version || '22' }}
          cache: npm
          cache-dependency-path: refact-agent/gui/package-lock.json

      - name: Install GUI build dependencies
        working-directory: refact-agent/gui
        run: npm ci --include=dev

      - name: Disable local development defaults and install stable Rust
        shell: bash
        run: |
          rm -f ../../.cargo/config.toml
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src --no-self-update

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold lld

      - name: Restore cached cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: refact-agent/engine -> target
          key: ubuntu-engine-perf-cargo-bundled-whisper-v1
          shared-key: ubuntu-engine-perf-cargo-bundled-whisper-v1
          cache-bin: false

      - name: Run engine performance benchmarks
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          set -o pipefail
          cargo test -p refact-lsp --lib --features perf-tests -- chat::perf_harness --include-ignored --test-threads=1 --nocapture 2>&1 | tee test-output.txt
          python3 ../../tools/dev/ci_tests.py verify-output test-output.txt

      - name: Run all ignored coordination benchmarks
        shell: bash
        run: |
          export GITHUB_SHA="$REFACT_SOURCE_SHA"
          set -o pipefail
          cargo test -p refact-lsp --lib --features perf-tests -- coordination:: --ignored --test-threads=1 --nocapture 2>&1 | tee coordination-output.txt
          python3 ../../tools/dev/ci_tests.py verify-output coordination-output.txt

      - name: Retain benchmark comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-perf-${{ inputs.source_sha || github.sha }}
          path: |
            refact-agent/engine/test-output.txt
            refact-agent/engine/coordination-output.txt
            refact-agent/engine/target/*benchmark*.json
          if-no-files-found: error
