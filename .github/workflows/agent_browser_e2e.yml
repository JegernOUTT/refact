name: Browser E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: agent-browser-e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: refact-agent/engine

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  injected-bundle-freshness:
    name: Injected bundle freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Rebuild the injected bundle
        run: bash tools/dev/build_injected.sh

      - name: Fail when the checked-in bundle drifted from refactInjected.ts
        run: git diff --exit-code refact-agent/engine/crates/refact-browser/src/generated/injected_bundle.js

  browser-e2e:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'browser-e2e')
    name: Browser E2E (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup update --no-self-update stable

      - name: Install build tools and Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold lld wget
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/google-chrome.deb
          sudo apt-get install -y /tmp/google-chrome.deb

      - name: Allow the Chrome sandbox to use unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Restore cached cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: refact-agent/engine -> target
          key: ubuntu-browser-e2e-cargo
          shared-key: ubuntu-browser-e2e-cargo
          cache-bin: false

      # V-15: headless_chrome 1.0.20 drops Input.dragIntercepted on its non-flattened target transport.
      - name: Run browser E2E suite
        env:
          REFACT_BROWSER_E2E: "1"
        run: cargo test --test browser_e2e -- --ignored --test-threads=1 --skip html5_drag_and_drop_reaches_page_handler

      - name: Run browser differentiators suite
        env:
          REFACT_BROWSER_E2E: "1"
        run: cargo test --test browser_differentiators -- --ignored --test-threads=1
